Proximity="Streamerdesk ASMR - Proximity"
Description="Streamerdesk ASMR Suite: brings your voice closer to (or farther from) your listener's ear, without you having to move. Free software (GPL-2.0-or-later) - https://streamerdesk.com"

Group.Distance="Distance"
Group.Tone="Closeness and tone"
Group.Position="Position (for headphones)"
Group.Output="Output"

Distance="Distance from the ear [%]"
Distance.Help="The main control. 0 % = your voice right at the ear, warm and full; 100 % = as if you stepped to the other side of the room. For whispers, 0-30 % usually feels great. Move it live to come closer and drift away without leaving your mic."
LevelLoss="Volume drop with distance [%]"
LevelLoss.Help="How much the volume drops as distance grows, just like in real life. 100 % = realistic (down to about -18 dB at full distance); 0 % = volume stays the same and only the character changes. Lower it if you want to step back without losing loudness on stream."
HfLoss="Treble loss with distance [%]"
HfLoss.Help="Farther away, a voice loses sparkle and detail, like someone talking from across the room. High values make distance sound softer and duller; 0 % keeps all the brightness even when far."
Room="Room ambience [%]"
Room.Help="Adds the small reflections of a cosy room. You barely hear them up close and they grow as you move away, which is what makes the distance believable. 10-30 % sounds natural; 0 % = completely dry."

ProxAmount="Proximity effect (close-up bass) [%]"
ProxAmount.Help="That warm bass glow you get when a mic is really close to your mouth. 100 % = natural (about +10 dB of lows right at the ear); 150-200 % = very deep, great for tactile sounds; 0 % = no boost. It follows the distance automatically."
ProxFreq="Close-up bass frequency [Hz]"
ProxFreq.Help="Where the bass boost sits. 120-150 Hz feels deep and enveloping; 180-250 Hz sounds warmer and closer on higher voices. If your voice sounds boomy, raise it a little."
Air="Air and sparkle [dB]"
Air.Help="Adds or removes air at the top of your voice (from 7 kHz). A little boost (+1 to +3 dB) makes whispers crisp and tingly; a cut makes them softer and darker."
Warmth="Warmth [%]"
Warmth.Help="A very gentle, analog-style saturation that rounds your voice and adds body. 10-30 % adds warmth you won't notice as an effect; higher values give a thicker texture, nice for tapping and scratching."
Deharsh="Soften harsh S sounds"
Deharsh.Help="When the voice is very close, strong 's' sounds and clicks can sting the ear. This softens them only when they happen, without dulling the rest of your voice. It works harder the closer you are. Recommended on."
DeharshAmount="S softening amount [%]"
DeharshAmount.Help="How much strong 's' sounds are softened. 30-50 % is a good spot; raise it if your S sounds hiss in headphones, lower it if your voice feels a bit dull."
LowCut="Remove rumble (low cut) [Hz]"
LowCut.Help="Removes deep lows that aren't voice: desk bumps, PC fans or stand vibrations. 70-100 Hz is ideal for Blue Yeti, Rode and similar USB mics. Lower it (20-40 Hz) for bass-heavy tactile sounds."

PositionMode="Where the voice sits"
PositionMode.Center="Center (both ears)"
PositionMode.Left="Right at the left ear"
PositionMode.Right="Right at the right ear"
PositionMode.Custom="Custom"
PositionMode.Help="Choose whether you come in from the front or to one ear. 'Right at the ear' makes headphone listeners feel you are whispering on just one side. 'Custom' lets you pick the exact spot."
Position="Left / right position [%]"
Position.Help="-100 % = fully at the left ear, 0 % = centered, +100 % = fully at the right ear. Values in between give a slightly tilted position."
Binaural="Binaural mode (realistic in headphones)"
Binaural.Help="On: mimics how we really hear, with a tiny delay and head shadow on the opposite ear, so one-sided closeness feels very real. Off: a simple left-right pan."
InputMode="Input"
InputMode.Mono="Mono sum (recommended for mics)"
InputMode.Stereo="Keep stereo"
InputMode.Help="'Mono sum' blends both channels before the effect: perfect for USB mics (Blue Yeti, Rode...) that are mono or duplicated mono. 'Keep stereo' preserves the image of stereo sources such as binaural mics."

Mix="Effect intensity [%]"
Mix.Help="Blend between your original sound and the processed one. 100 % = full effect; lower values make it subtler."
OutputGain="Output volume [dB]"
OutputGain.Help="Sets the final volume. If OBS's meter hits red with a lot of proximity bass, lower it a bit; if you move the voice away and want to compensate, raise it."

Preset.AlOido="Al oído (right at the ear)"
Preset.CercanoSuave="Cercano suave (gently close)"
Preset.MediaDistancia="Media distancia (mid distance)"
Preset.MicroContacto="Micro de contacto (contact mic)"

Presets.Group="Presets"
Presets.Select="Preset"
Presets.Select.Help="Pick a preset to load it instantly. ★ = Streamerdesk built-in presets, to show what the effect can do; 👤 = your own presets. Then tweak any control and save it as yours."
Presets.None="— Choose a preset —"
Presets.BuiltinPrefix="★"
Presets.UserPrefix="👤"
Presets.Load="Load selected preset"
Presets.Load.Help="Reloads the chosen preset, for example to undo your changes."
Presets.Name="Name for my preset"
Presets.Name.Help="Type a name (for example 'Night whisper') and press 'Save preset'. If one with that name already exists, it is updated."
Presets.Save="Save preset"
Presets.Save.Help="Saves all current settings under the name above. Your presets stay only on your computer, survive closing OBS and work in any scene."
Presets.Delete="Delete preset"
Presets.Delete.Help="Deletes the selected preset of yours (built-in ★ presets can't be deleted)."
Presets.Reset="Reset to defaults"
Presets.Reset.Help="Returns every control to its starting value, tuned for whispering into USB mics."
