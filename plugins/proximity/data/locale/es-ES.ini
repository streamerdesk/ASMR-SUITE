Preset.MicroContacto="Micro de contacto"

Presets.Group="Presets"
Presets.Select="Preset"
Presets.Select.Help="Elige un preset para cargarlo al instante. ★ = presets incluidos de Streamerdesk, para que veas lo que puede hacer el efecto; 👤 = tus propios presets. Después puedes retocar cualquier control y guardarlo como tuyo."
Presets.None="— Elige un preset —"
Presets.BuiltinPrefix="★"
Presets.UserPrefix="👤"
Presets.Load="Cargar preset seleccionado"
Presets.Load.Help="Vuelve a cargar el preset elegido, por ejemplo para deshacer tus cambios."
Presets.Name="Nombre para mi preset"
Presets.Name.Help="Escribe un nombre (por ejemplo «Susurro noche») y pulsa «Guardar preset». Si ya existe uno con ese nombre, se actualiza."
Presets.Save="Guardar preset"
Presets.Save.Help="Guarda todos los ajustes actuales con el nombre de arriba. Tus presets se quedan solo en tu ordenador, se conservan al cerrar OBS y sirven en cualquier escena."
Presets.Delete="Borrar preset"
Presets.Delete.Help="Borra el preset tuyo seleccionado (los presets ★ incluidos no se pueden borrar)."
Presets.Reset="Restablecer valores por defecto"
Presets.Reset.Help="Devuelve todos los controles a sus valores iniciales, pensados para susurros con micros USB."
