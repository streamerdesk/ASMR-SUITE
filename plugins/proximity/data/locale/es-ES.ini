Proximity="Streamerdesk ASMR - Proximidad"
Description="Streamerdesk ASMR Suite: acerca o aleja tu voz del oído de quien te escucha, sin que tengas que moverte. Software libre (GPL-2.0-or-later) - https://streamerdesk.com"

Group.Distance="Distancia"
Group.Tone="Cercanía y tono"
Group.Position="Posición (con auriculares)"
Group.Output="Salida"

Distance="Distancia al oído [%]"
Distance.Help="El control principal. 0 % = tu voz pegadita al oído, cálida y con mucho cuerpo; 100 % = como si te alejaras al otro lado de la habitación. Para susurros suelen ir genial valores entre 0 y 30 %. Muévelo en directo para acercarte y alejarte sin moverte del micro."
LevelLoss="Bajada de volumen al alejarse [%]"
LevelLoss.Help="Cuánto baja el volumen cuando la distancia sube, como pasa en la vida real. 100 % = realista (hasta unos -18 dB a máxima distancia); 0 % = el volumen no cambia y solo cambia el carácter del sonido. Si quieres alejarte sin perder volumen en el directo, bájalo."
HfLoss="Pérdida de agudos al alejarse [%]"
HfLoss.Help="Al alejarse, la voz pierde brillo y detalle, como cuando alguien te habla desde lejos. Con valores altos la distancia se nota más «apagada» y suave; con 0 % la voz conserva todo el brillo aunque esté lejos."
Room="Ambiente de habitación [%]"
Room.Help="Añade pequeños rebotes de una habitación pequeña. Casi no se oyen cuando estás cerca y crecen al alejarte, que es lo que hace creíble la distancia. 10-30 % suena natural; 0 % = completamente seco."

ProxAmount="Efecto proximidad (graves de cercanía) [%]"
ProxAmount.Help="Es el «calorcito» de graves que aparece cuando un micro está muy cerca de la boca. 100 % = natural (unos +10 dB de graves pegado al oído); 150-200 % = muy profundo, ideal para sonidos táctiles; 0 % = sin realce. Se ajusta solo según la distancia."
ProxFreq="Frecuencia de los graves de cercanía [Hz]"
ProxFreq.Help="Dónde se nota el realce de graves. 120-150 Hz suena profundo y envolvente; 180-250 Hz suena más cálido y cercano en voces agudas. Si tu voz suena «embotada», súbelo un poco."
Air="Aire y brillo [dB]"
Air.Help="Da o quita aire en la zona alta de la voz (desde 7 kHz). Un poco positivo (+1 a +3 dB) hace los susurros más nítidos y cosquilleantes; negativo los vuelve más suaves y oscuros."
Warmth="Calidez [%]"
Warmth.Help="Una saturación muy suave, como un equipo analógico, que redondea la voz y le da cuerpo. 10-30 % aporta calidez sin que se note; valores altos dan una textura más gruesa, útil para tapping y roces."
Deharsh="Suavizar eses"
Deharsh.Help="Cuando la voz está muy cerca, las «s» y los chasquidos fuertes pueden molestar al oído. Esto los suaviza solo cuando aparecen, sin apagar el resto de la voz. Actúa más cuanto más cerca estás. Recomendado activado."
DeharshAmount="Cantidad de suavizado de eses [%]"
DeharshAmount.Help="Cuánto se suavizan las «s» fuertes. 30-50 % es un buen punto; súbelo si tus eses pitan con auriculares, bájalo si notas la voz algo apagada."
LowCut="Quitar retumbes (corte de graves) [Hz]"
LowCut.Help="Elimina graves profundos que no son voz: golpes en la mesa, el ventilador del PC o vibraciones del soporte. 70-100 Hz es ideal para Blue Yeti, Rode y micros USB parecidos. Bájalo (20-40 Hz) para sonidos táctiles con mucho grave."

PositionMode="Dónde suena la voz"
PositionMode.Center="Centro (los dos oídos)"
PositionMode.Left="Pegada al oído izquierdo"
PositionMode.Right="Pegada al oído derecho"
PositionMode.Custom="Personalizada"
PositionMode.Help="Elige si te acercas de frente o a un oído en concreto. «Pegada al oído» hace que quien escucha con auriculares sienta que le susurras a un solo lado. «Personalizada» te deja elegir el punto exacto."
Position="Posición izquierda / derecha [%]"
Position.Help="-100 % = totalmente en el oído izquierdo, 0 % = centrado, +100 % = totalmente en el oído derecho. Los puntos intermedios dan una posición ligeramente ladeada."
Binaural="Modo binaural (realista con auriculares)"
Binaural.Help="Activado: imita cómo oímos de verdad, con un pequeñísimo retraso y la sombra de la cabeza en el oído contrario, para que la cercanía a un lado sea muy real. Desactivado: un panorama simple de izquierda a derecha."
InputMode="Entrada"
InputMode.Mono="Suma mono (recomendado para micrófonos)"
InputMode.Stereo="Mantener estéreo"
InputMode.Help="«Suma mono» une los dos canales antes del efecto: perfecto para micros USB (Blue Yeti, Rode...) que son mono o mono duplicado. «Mantener estéreo» respeta la imagen de fuentes estéreo, como micros binaurales."

Mix="Intensidad del efecto [%]"
Mix.Help="Mezcla entre tu sonido original y el procesado. 100 % = efecto completo; valores más bajos lo hacen más sutil."
OutputGain="Volumen de salida [dB]"
OutputGain.Help="Ajusta el volumen final. Si el medidor de OBS llega al rojo con mucho efecto proximidad, bájalo un poco; si alejas la voz y quieres compensar, súbelo."

