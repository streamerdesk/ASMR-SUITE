Spatializer="Streamerdesk ASMR - Binaural Spatializer"
Description="Streamerdesk ASMR Suite: places your voice anywhere around your headphone listener's head (left, behind, above...) and glides it smoothly. Free software (GPL-2.0-or-later) - https://streamerdesk.com"

Group.Position="Position in space"
Group.Realism="Realism"
Group.Output="Input and output"

QuickPos="Quick position"
QuickPos.Left="Left ear"
QuickPos.Right="Right ear"
QuickPos.Front="Front"
QuickPos.Behind="Behind"
QuickPos.Above="Above the head"
QuickPos.Custom="Custom"
QuickPos.Help="Choose where your voice sits around your listener's head. Change it live and your voice will travel there smoothly. 'Custom' lets you pick the exact spot in degrees."
Azimuth="Direction around the head [°]"
Azimuth.Help="Where the voice is, like clock hands seen from above: 0° = front, 90° = right, 180° = behind, 270° = left. When moving between points, the voice always takes the shortest way."
Elevation="Height [°]"
Elevation.Help="How high the voice is: 0° = ear level, 90° = right above the head, negative values = below, as if speaking from the shoulder or chest."
Distance="Distance [%]"
Distance.Help="How close you are. 0 % = right at the ear (warm lows, the other ear barely hears you); 100 % = across the room. For whispers, 0-30 % feels the most enveloping."
Glide="Glide time [s]"
Glide.Help="How long the voice takes to travel from one position to another when you change it. 1-3 s gives slow, relaxing moves, perfect for ASMR; 0 s jumps almost instantly (with minimal smoothing so there are no clicks)."

Cues="Direction cue strength [%]"
Cues.Help="Strengthens the small tone changes our ears use to tell front, behind and above. 100 % = natural; raise it (130-200 %) if 'behind' or 'above' is hard to notice in your headphones; lower it if the voice sounds too coloured."
Prox="Close-up bass [%]"
Prox.Help="The warm bass glow you get when a voice is very close to the ear. It only works at short distances. 100 % = natural; more = deeper; 0 % = no boost."
AirLoss="Treble loss with distance [%]"
AirLoss.Help="Farther away, the voice loses sparkle, like in real life. High values make distance softer and duller; 0 % keeps all the brightness even when far."
LevelLoss="Volume drop with distance [%]"
LevelLoss.Help="How much the volume drops as you move away. 100 % = realistic (down to about -18 dB at full distance); 0 % = same volume at any distance, if you don't want to lose loudness on stream."
Room="Room ambience [%]"
Room.Help="Adds the small reflections of a cosy room. You barely hear them up close and they grow as you move away, which makes distance believable. 0 % = completely dry."

InputMode="Input"
InputMode.Mono="Mono sum (recommended for mics)"
InputMode.Stereo="Keep stereo"
InputMode.Help="'Mono sum' blends both channels before the effect: perfect for USB mics (Blue Yeti, Rode...) that are mono or duplicated mono. 'Keep stereo' processes each channel through its own ear, for stereo sources."
Mix="Effect intensity [%]"
Mix.Help="Blend between your original sound and the spatialized one. 100 % = full effect; lower values make it subtler."
OutputGain="Output volume [dB]"
OutputGain.Help="Sets the final volume. Raise it a little if you move the voice away and want to compensate; lower it if OBS's meter hits red."

Preset.LeftEar="Al oído izquierdo (at the left ear)"
Preset.Behind="Detrás de ti (behind you)"
Preset.Above="Encima de la cabeza (above your head)"
Preset.FrontClose="Frente cercano (close in front)"

Presets.Group="Presets"
Presets.Select="Preset"
Presets.Select.Help="Pick a preset to load it instantly. ★ = Streamerdesk built-in presets, to show what the effect can do; 👤 = your own presets. Then tweak any control and save it as yours."
Presets.None="— Choose a preset —"
Presets.BuiltinPrefix="★"
Presets.UserPrefix="👤"
Presets.Load="Load selected preset"
Presets.Load.Help="Reloads the chosen preset, for example to undo your changes."
Presets.Name="Name for my preset"
Presets.Name.Help="Type a name (for example 'Night whisper') and press 'Save preset'. If one with that name already exists, it is updated."
Presets.Save="Save preset"
Presets.Save.Help="Saves all current settings under the name above. Your presets stay only on your computer, survive closing OBS and work in any scene."
Presets.Delete="Delete preset"
Presets.Delete.Help="Deletes the selected preset of yours (built-in ★ presets can't be deleted)."
Presets.Reset="Reset to defaults"
Presets.Reset.Help="Returns every control to its starting value, tuned for whispering into USB mics."
