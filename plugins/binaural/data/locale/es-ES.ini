Spatializer="Streamerdesk ASMR - Espacialidad binaural"
Description="Streamerdesk ASMR Suite: coloca tu voz en cualquier punto alrededor de la cabeza de quien te escucha con auriculares (izquierda, detrás, encima...) y muévela suavemente. Software libre (GPL-2.0-or-later) - https://streamerdesk.com"

Group.Position="Posición en el espacio"
Group.Realism="Realismo"
Group.Output="Entrada y salida"

QuickPos="Posición rápida"
QuickPos.Left="Oído izquierdo"
QuickPos.Right="Oído derecho"
QuickPos.Front="Delante"
QuickPos.Behind="Detrás"
QuickPos.Above="Encima de la cabeza"
QuickPos.Custom="Personalizada"
QuickPos.Help="Elige dónde quieres que suene tu voz alrededor de la cabeza de quien te escucha. Cambia de posición en directo y la voz viajará suavemente hasta allí. «Personalizada» te deja elegir el punto exacto con los grados."
Azimuth="Dirección alrededor de la cabeza [°]"
Azimuth.Help="Hacia dónde está la voz, como las agujas de un reloj vistas desde arriba: 0° = delante, 90° = a la derecha, 180° = detrás, 270° = a la izquierda. Al pasar de un punto a otro, la voz va siempre por el camino más corto."
Elevation="Altura [°]"
Elevation.Help="A qué altura está la voz: 0° = a la altura de las orejas, 90° = justo encima de la cabeza, valores negativos = por debajo, como si hablaras desde el hombro o el pecho."
Distance="Distancia [%]"
Distance.Help="Lo cerca que estás. 0 % = pegadita a la oreja (con graves cálidos y el otro oído casi sin oírte); 100 % = al otro lado de la habitación. Para susurros, entre 0 y 30 % es lo más envolvente."
Glide="Tiempo de deslizamiento [s]"
Glide.Help="Cuánto tarda la voz en viajar de una posición a otra cuando la cambias. 1-3 s da movimientos lentos y relajantes, ideales para ASMR; 0 s salta casi al instante (con un suavizado mínimo para que no haya clics)."

Cues="Intensidad de las pistas de dirección [%]"
Cues.Help="Refuerza los pequeños cambios de tono que usa el oído para saber si un sonido está delante, detrás o encima. 100 % = natural; súbelo (130-200 %) si te cuesta notar «detrás» o «encima» con tus auriculares; bájalo si la voz suena demasiado coloreada."
Prox="Graves de cercanía [%]"
Prox.Help="El calorcito de graves que aparece cuando la voz está muy cerca de la oreja. Solo actúa a distancias cortas. 100 % = natural; más = más profundo; 0 % = sin realce."
AirLoss="Pérdida de agudos con la distancia [%]"
AirLoss.Help="Al alejarse, la voz pierde brillo, como en la vida real. Valores altos hacen la distancia más suave y apagada; 0 % mantiene todo el brillo aunque esté lejos."
LevelLoss="Bajada de volumen con la distancia [%]"
LevelLoss.Help="Cuánto baja el volumen al alejarse. 100 % = realista (hasta unos -18 dB a máxima distancia); 0 % = mismo volumen en cualquier distancia, por si no quieres perder nivel en el directo."
Room="Ambiente de habitación [%]"
Room.Help="Añade los pequeños rebotes de una habitación acogedora. Casi no se oyen de cerca y crecen al alejarte, lo que ayuda a creerse la distancia. 0 % = completamente seco."

InputMode="Entrada"
InputMode.Mono="Suma mono (recomendado para micrófonos)"
InputMode.Stereo="Mantener estéreo"
InputMode.Help="«Suma mono» une los dos canales antes del efecto: perfecto para micros USB (Blue Yeti, Rode...) que son mono o mono duplicado. «Mantener estéreo» trata cada canal por su oído, para fuentes estéreo."
Mix="Intensidad del efecto [%]"
Mix.Help="Mezcla entre tu sonido original y el colocado en el espacio. 100 % = efecto completo; valores más bajos lo hacen más sutil."
OutputGain="Volumen de salida [dB]"
OutputGain.Help="Ajusta el volumen final. Súbelo un poco si alejas la voz y quieres compensar; bájalo si el medidor de OBS llega al rojo."

Preset.LeftEar="Al oído izquierdo"
Preset.Behind="Detrás de ti"
Preset.Above="Encima de la cabeza"
Preset.FrontClose="Frente cercano"

Presets.Group="Presets"
Presets.Select="Preset"
Presets.Select.Help="Elige un preset para cargarlo al instante. ★ = presets incluidos de Streamerdesk, para que veas lo que puede hacer el efecto; 👤 = tus propios presets. Después puedes retocar cualquier control y guardarlo como tuyo."
Presets.None="— Elige un preset —"
Presets.BuiltinPrefix="★"
Presets.UserPrefix="👤"
Presets.Load="Cargar preset seleccionado"
Presets.Load.Help="Vuelve a cargar el preset elegido, por ejemplo para deshacer tus cambios."
Presets.Name="Nombre para mi preset"
Presets.Name.Help="Escribe un nombre (por ejemplo «Susurro noche») y pulsa «Guardar preset». Si ya existe uno con ese nombre, se actualiza."
Presets.Save="Guardar preset"
Presets.Save.Help="Guarda todos los ajustes actuales con el nombre de arriba. Tus presets se quedan solo en tu ordenador, se conservan al cerrar OBS y sirven en cualquier escena."
Presets.Delete="Borrar preset"
Presets.Delete.Help="Borra el preset tuyo seleccionado (los presets ★ incluidos no se pueden borrar)."
Presets.Reset="Restablecer valores por defecto"
Presets.Reset.Help="Devuelve todos los controles a sus valores iniciales, pensados para susurros con micros USB, con la voz delante."
