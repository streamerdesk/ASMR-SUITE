Orbit="Streamerdesk ASMR - 8D / Orbit"
Description="Streamerdesk ASMR Suite: your voice gently circles around the listener's head on headphones (binaural 8D effect). Free software (GPL-2.0-or-later) - https://streamerdesk.com"

Group.Motion="Motion"
Group.Head="Head & ears (binaural)"
Group.Space="Distance & room"
Group.Mix="Input & mix"

Mode="Motion type"
Mode.Orbit="Continuous orbit (360°)"
Mode.Arc="Back-and-forth arc"
Mode.Wander="Random wander"
Mode.Tempo="Tempo-synced orbit (BPM)"
Mode.Help="How your voice moves around the head. “Continuous orbit”: full circles, the classic 8D effect. “Back-and-forth arc”: travels between two points and back, e.g. from one ear to the other across the front. “Random wander”: drifts smoothly and unpredictably, like a butterfly. “Tempo-synced orbit”: each lap lasts an exact number of bars of your music."
SpeedUnit="Speed in"
SpeedUnit.Seconds="Seconds per lap"
SpeedUnit.Hz="Laps per second (Hz)"
SpeedUnit.Help="Choose how you'd like to set the speed: seconds per full lap (most intuitive) or laps per second (Hz), like other effect plugins."
Period="Lap duration [s]"
Period.Help="How many seconds your voice takes to go all the way around (in “Arc”, one round trip; in “Wander”, the average speed). For relaxing ASMR 8-20 s is lovely; under 4 s gets dizzying."
Rate="Speed [Hz]"
Rate.Help="Laps per second. 0.05-0.12 Hz is slow and relaxing; 0.5 Hz = one lap every 2 seconds, very intense."
Bpm="Tempo [BPM]"
Bpm.Help="The tempo of your music or session in beats per minute. The orbit uses it so each lap lines up with the bars."
Bars="Bars per lap"
Bars.Half="½ bar"
Bars.1="1 bar"
Bars.2="2 bars"
Bars.4="4 bars"
Bars.8="8 bars"
Bars.16="16 bars"
Bars.Help="How many 4-beat bars one full lap lasts. Example: 90 BPM and 4 bars = one lap every 10.7 s. The motion follows the tempo but isn't locked to the song's start: to line it up with the “one”, switch the motion type right on the beat."
Direction="Direction"
Direction.CW="Clockwise (front → right → back → left)"
Direction.CCW="Counter-clockwise (front → left → back → right)"
Direction.Help="Which way your voice turns, seen from above the head. In “Random wander” it's the preferred direction (it sometimes turns back)."
StartAngle="Start angle [°]"
StartAngle.Help="Where the motion begins: 0° = front, 90° = right ear, -90° = left ear, 180° = behind. In “Arc” it's where the arc starts. Change it live and the voice glides smoothly to the new spot."
ArcWidth="Arc width [°]"
ArcWidth.Help="How far the back-and-forth travels. 180° from -90° = ear to ear across the front (perfect for ear-to-ear whispers); 90° = a gentle sway; 360° = a full lap one way, then back."
NearEars="Stay near the ears [%]"
NearEars.Help="Makes your voice linger next to each ear and cross the front and back more quickly. The ears are where the effect feels most intimate and tingly, and it hides the usual front/back confusion of headphones."
Elevation="Height movement [%]"
Elevation.Help="Adds a gentle up-and-down wave (up to ±35°) while it circles, as if the voice were floating around your head. 0 % = always at ear level."

Binaural="Binaural intensity [%]"
Binaural.Help="How strongly the head model is applied: the time difference between ears (up to 0.66 ms), the level difference and the head “shadow” that darkens the far ear. 100 % = realistic and very immersive; 50 % = subtler; 0 % = no spatial effect (centered voice)."
FrontBack="Front / back cues [%]"
FrontBack.Help="Helps the brain tell whether the voice is in front or behind: behind sounds a little darker with a small notch in the highs (like your outer ear does); in front, slightly more present. Raise it if you can't tell when it passes behind you."

Distance="Distance (orbit radius) [m]"
Distance.Help="How far away your voice circles. 0.25-0.5 m = right next to the head, intimate, with warm lows and strong ear-to-ear differences (ideal for ASMR whispers); 1-2 m = someone walking around you; 4 m = distant, softer, less bright, with more room."
Room="Room [%]"
Room.Help="A touch of room around the voice (using the Streamerdesk Reverb engine). It helps the sound feel outside your head instead of “inside the headphones”. It's more noticeable the farther the voice is. 10-30 % sounds natural."

InputMode="Input"
InputMode.Mono="Mono sum (recommended for microphones)"
InputMode.Stereo="Keep stereo"
InputMode.Help="“Mono sum” merges both channels into a single circling voice: perfect for USB/condenser mics (Blue Yeti, Rode…) that are mono or dual-mono. “Keep stereo” circles the left and right channels as a pair 60° apart, useful for binaural mics or music."
DryWet="Original / 8D mix (DRY / WET) [%]"
DryWet.Help="Balance between your original (centered) voice and the moving voice. 100 % = 8D only (recommended); 50 % = both at full volume; 0 % = effect off. Note: lots of original voice weakens the motion and can sound a bit “hollow”."
OutputGain="Output volume [dB]"
OutputGain.Help="Adjusts the final volume after the effect. Lower it if the OBS meter hits red."

Presets.Group="Presets"
Presets.Select="Preset"
Presets.Select.Help="Pick a preset to load it instantly. ★ = built-in Streamerdesk presets; 👤 = your own presets. Then tweak any control and save it as your own."
Presets.None="— Choose a preset —"
Presets.BuiltinPrefix="★"
Presets.UserPrefix="👤"
Presets.Load="Load selected preset"
Presets.Load.Help="Reloads the selected preset, e.g. to undo your changes."
Presets.Name="Name for my preset"
Presets.Name.Help="Type a name (e.g. “Slow night orbit”) and press “Save preset”. If one with that name exists, it is updated."
Presets.Save="Save preset"
Presets.Save.Help="Saves all current settings under the name above. Your presets are stored only on your computer and survive OBS restarts."
Presets.Delete="Delete preset"
Presets.Delete.Help="Deletes the selected user preset (built-in ★ presets can't be deleted)."
Presets.Reset="Reset to defaults"
Presets.Reset.Help="Returns every control to its starting value: a slow 12 s orbit close to the head, tuned for whispering into USB/condenser microphones."
Preset.Classic8D="Classic 8D orbit"
Preset.EarToEar="Ear-to-ear whisper"
Preset.Butterfly="Wandering butterfly"
Preset.Hypnotic="Hypnotic pulse (tempo)"
