Orbit="Streamerdesk ASMR - 8D / Órbita"
Description="Streamerdesk ASMR Suite: tu voz gira suavemente alrededor de la cabeza de quien escucha con auriculares (efecto 8D binaural). Software libre (GPL-2.0-or-later) - https://streamerdesk.com"

Group.Motion="Movimiento"
Group.Head="Cabeza y oídos (binaural)"
Group.Space="Distancia y sala"
Group.Mix="Entrada y mezcla"

Mode="Tipo de movimiento"
Mode.Orbit="Órbita continua (360°)"
Mode.Arc="Vaivén en arco"
Mode.Wander="Deriva aleatoria"
Mode.Tempo="Órbita al ritmo (BPM)"
Mode.Help="Cómo se mueve tu voz alrededor de la cabeza. «Órbita continua»: da vueltas completas, el clásico efecto 8D. «Vaivén en arco»: va y vuelve entre dos puntos, por ejemplo de un oído al otro pasando por delante. «Deriva aleatoria»: pasea de forma suave e impredecible, como una mariposa. «Órbita al ritmo»: cada vuelta dura un número exacto de compases de tu música."
SpeedUnit="Velocidad en"
SpeedUnit.Seconds="Segundos por vuelta"
SpeedUnit.Hz="Vueltas por segundo (Hz)"
SpeedUnit.Help="Elige cómo prefieres ajustar la velocidad: en segundos que tarda una vuelta (lo más intuitivo) o en vueltas por segundo (Hz), como en otros plugins de efectos."
Period="Duración de una vuelta [s]"
Period.Help="Cuántos segundos tarda tu voz en dar una vuelta completa (en «Vaivén», un viaje de ida y vuelta; en «Deriva», la velocidad media). Para ASMR relajante, 8-20 s es delicioso; menos de 4 s resulta mareante."
Rate="Velocidad [Hz]"
Rate.Help="Vueltas por segundo. 0,05-0,12 Hz es lento y relajante; 0,5 Hz = una vuelta cada 2 segundos, muy intenso."
Bpm="Tempo [BPM]"
Bpm.Help="El tempo de tu música o de tu sesión, en pulsos por minuto. La órbita usa este valor para que cada vuelta coincida con los compases."
Bars="Compases por vuelta"
Bars.Half="½ compás"
Bars.1="1 compás"
Bars.2="2 compases"
Bars.4="4 compases"
Bars.8="8 compases"
Bars.16="16 compases"
Bars.Help="Cuántos compases de 4 tiempos dura una vuelta completa. Ejemplo: 90 BPM y 4 compases = una vuelta cada 10,7 s. El giro va al tempo, pero no se engancha al inicio de la canción: si quieres que coincida con el «uno», cambia el tipo de movimiento justo en el golpe."
Direction="Sentido de giro"
Direction.CW="Horario (delante → derecha → detrás → izquierda)"
Direction.CCW="Antihorario (delante → izquierda → detrás → derecha)"
Direction.Help="Hacia qué lado empieza a girar tu voz, visto desde arriba de la cabeza. En «Deriva aleatoria» es el sentido preferido (a veces da la vuelta)."
StartAngle="Ángulo inicial [°]"
StartAngle.Help="Dónde empieza el movimiento: 0° = delante, 90° = oído derecho, -90° = oído izquierdo, 180° = detrás. En «Vaivén en arco» es el punto de partida del arco. Si lo cambias en directo, la voz se desliza suavemente hasta la nueva posición."
ArcWidth="Anchura del arco [°]"
ArcWidth.Help="Cuánto recorre el vaivén. 180° desde -90° = de un oído al otro pasando por delante (perfecto para susurros de oído a oído); 90° = un balanceo suave; 360° = vuelta completa de ida y otra de vuelta."
NearEars="Quedarse cerca de los oídos [%]"
NearEars.Help="Hace que tu voz pase más tiempo junto a cada oído y cruce más deprisa por delante y por detrás. Los oídos son donde el efecto se siente más íntimo y cosquilleante, y así se nota menos la típica confusión delante/detrás de los auriculares."
Elevation="Movimiento de altura [%]"
Elevation.Help="Añade una ondulación suave hacia arriba y hacia abajo (hasta ±35°) mientras gira, como si la voz flotara alrededor de tu cabeza. 0 % = siempre a la altura de los oídos."

Binaural="Intensidad binaural [%]"
Binaural.Help="Cuánto se aplica el modelo de cabeza: la diferencia de tiempo entre oídos (hasta 0,66 ms), la diferencia de volumen y la «sombra» de la cabeza que oscurece el oído lejano. 100 % = realista y muy envolvente; 50 % = más sutil; 0 % = sin efecto espacial (voz centrada)."
FrontBack="Pistas delante / detrás [%]"
FrontBack.Help="Ayuda al cerebro a distinguir si la voz está delante o detrás: detrás suena algo más oscura y con una pequeña muesca en los agudos (como hace la oreja); delante, un poco más presente. Súbelo si al girar no notas cuándo pasa por detrás."

Distance="Distancia (radio de la órbita) [m]"
Distance.Help="A qué distancia gira tu voz. 0,25-0,5 m = pegada a la cabeza, íntima, con graves cálidos y diferencias muy marcadas entre oídos (ideal para susurros ASMR); 1-2 m = alguien paseando a tu alrededor; 4 m = lejana, más suave, menos brillante y con más sala."
Room="Sala [%]"
Room.Help="Un poco de habitación alrededor de la voz (usa el motor de la Reverb de Streamerdesk). Ayuda a que el sonido se sienta fuera de tu cabeza y no «dentro de los auriculares». Se nota más cuanto más lejos está la voz. 10-30 % es natural."

InputMode="Entrada"
InputMode.Mono="Suma mono (recomendado para micrófonos)"
InputMode.Stereo="Mantener estéreo"
InputMode.Help="«Suma mono» une los dos canales en una sola voz que gira: perfecto para micrófonos USB/condensador (Blue Yeti, Rode…), que son mono o mono duplicado. «Mantener estéreo» hace girar los canales izquierdo y derecho como una pareja separada 60°, útil para micros binaurales o música."
DryWet="Mezcla original / 8D (DRY / WET) [%]"
DryWet.Help="Proporción entre tu voz original (centrada) y la voz en movimiento. 100 % = solo 8D (recomendado); 50 % = ambas a pleno volumen; 0 % = efecto apagado. Ojo: mezclar mucho original apaga el giro y puede sonar algo «hueco»."
OutputGain="Volumen de salida [dB]"
OutputGain.Help="Ajusta el volumen final después del efecto. Bájalo si el medidor de OBS llega al rojo."

Presets.Group="Presets"
Presets.Select="Preset"
Presets.Select.Help="Elige un preset para cargarlo al instante. ★ = presets incluidos de Streamerdesk; 👤 = tus propios presets. Después puedes retocar cualquier control y guardarlo como tuyo."
Presets.None="— Elige un preset —"
Presets.BuiltinPrefix="★"
Presets.UserPrefix="👤"
Presets.Load="Cargar preset seleccionado"
Presets.Load.Help="Vuelve a cargar el preset elegido, por ejemplo para deshacer tus cambios."
Presets.Name="Nombre para mi preset"
Presets.Name.Help="Escribe un nombre (por ejemplo «Vuelta lenta nocturna») y pulsa «Guardar preset». Si ya existe uno con ese nombre, se actualiza."
Presets.Save="Guardar preset"
Presets.Save.Help="Guarda todos los ajustes actuales con el nombre de arriba. Tus presets se guardan solo en tu ordenador y se conservan al reiniciar OBS."
Presets.Delete="Borrar preset"
Presets.Delete.Help="Borra el preset de usuario seleccionado (los presets ★ incluidos no se pueden borrar)."
Presets.Reset="Restablecer valores por defecto"
Presets.Reset.Help="Devuelve todos los controles a sus valores iniciales: una órbita lenta de 12 s, cerca de la cabeza, pensada para susurros con micrófonos USB/condensador."
Preset.Classic8D="Órbita 8D clásica"
Preset.EarToEar="Susurro de oído a oído"
Preset.Butterfly="Mariposa errante"
Preset.Hypnotic="Pulso hipnótico (al ritmo)"
