PingPongEcho="Streamerdesk ASMR - Ping-Pong Echo"
Description="Streamerdesk ASMR Suite: stereo ping-pong (ear-to-ear) echo inspired by TAL-Dub 1. Free software (GPL-2.0-or-later) - https://streamerdesk.com"

Group.Echo="Echo"
Group.Stereo="Stereo / Binaural"
Group.Tone="Tone (filter)"
Group.Mix="Mix"

SyncMode="Time mode"
SyncMode.Manual="Manual (milliseconds)"
SyncMode.Tempo="Musical tempo (BPM + note)"
SyncMode.Help="Choose how the time between repeats is set. “Manual” lets you pick exact milliseconds. “Musical tempo” computes the time from the BPM of your background music so the echo stays in time."
DelayLink="Link left/right times (LINK)"
DelayLink.Help="On: both ears use the same time and the bounce is regular, like a pendulum. Turn it off to give each side its own time for wider, more organic, irregular bounces."
DelayL="Echo time (left) [ms]"
DelayL.Help="How long each repeat takes. 150-300 ms feels close and intimate (great for whispers); 300-600 ms is the classic bouncing echo; above 600 ms creates wide, spacious atmospheres. With LINK on it controls both sides."
DelayR="Echo time (right) [ms]"
DelayR.Help="Time of the right-ear repeats when LINK is off. A value slightly different from the left makes the sound “circle” around the head."
BPM="Tempo [BPM]"
BPM.Help="Beats per minute of your music or rhythm. The echo follows this tempo using the selected note value."
DivL="Note value (left)"
DivL.Help="Echo length as a note value: 1/4 = quarter note, 1/8 = eighth note, “.” = dotted (longer), “T” = triplet. 1/8. (dotted eighth) is the classic dub echo."
DivR="Note value (right)"
DivR.Help="Note value for the right side when LINK is off."
FeedbackLink="Link left/right feedback (LINK)"
FeedbackLink.Help="On: both sides repeat the same number of times. Turn it off to give one ear a longer echo tail than the other."
FeedbackL="Repeats / feedback (left) [%]"
FeedbackL.Help="How many times the echo repeats before fading. 20-40% = a few soft repeats; 50-70% = long tail; above 100% the echo grows endlessly (extreme dub effect, kept under control by the limiter). With LINK on it controls both sides."
FeedbackR="Repeats / feedback (right) [%]"
FeedbackR.Help="Amount of repeats on the right side when LINK is off."
Saturate="Warm limiter in the feedback"
Saturate.Help="Just like TAL-Dub: a soft limiter that rounds off and warms the repeats and keeps the echo from running away at high feedback. Recommended on."

PingPong="Ping-pong amount (ear-to-ear bounce) [%]"
PingPong.Help="100% = every repeat jumps from one ear to the other (left, right, left...): the signature ASMR effect on headphones. 0% = normal stereo echo without bouncing. Values in between give a subtler bounce."
StartSide="First repeat plays on"
StartSide.Left="Left"
StartSide.Right="Right"
StartSide.Help="Which ear the bounce starts on. Handy to match your position on camera or other effects."
InputMode="Input"
InputMode.Mono="Mono sum (recommended for microphones)"
InputMode.Stereo="Keep stereo"
InputMode.Help="“Mono sum” mixes both channels before the echo: perfect for USB/condenser mics (Blue Yeti, Rode...) that are mono or dual-mono, giving a clean, centered bounce. “Keep stereo” preserves the image of stereo sources (music, binaural mics)."
SwapLR="Swap input left/right (SWAP L/R)"
SwapLR.Help="Swaps the input channels before the effect (like TAL-Dub's SWAP L/R button). Only available with stereo input."

Damp="Echo brightness / high cut (DAMP) [Hz]"
Damp.Help="12 dB/oct resonant low-pass filter. Low values (1500-3500 Hz) darken the repeats for a warm, soft, vintage echo, ideal for relaxing ASMR; high values keep the echo bright. 20000 Hz = filter off."
Resonance="Filter resonance (RESONANCE) [%]"
Resonance.Help="Emphasizes the filter cutoff: high values give the repeats a whistling, psychedelic dub tone. For soft ASMR keep it low (0-20%)."
LowCut="Low cut (LOW CUT) [Hz]"
LowCut.Help="Removes bass from the repeats so the echo doesn't muddy your voice or boom with the mic's proximity effect. 100-150 Hz is a good spot for condenser mics. 10 Hz = off."
FilterFB="Filter inside the feedback (FILTER FB)"
FilterFB.Help="On (like TAL-Dub): every repeat goes through the filter again, so the echo gets darker and further away with each bounce, very natural. Off: the filter is applied once at the end (FX mode) and all repeats share the same tone."
FilterIn="Also filter the original voice (IN)"
FilterIn.Help="Applies the filter to the dry signal (your direct voice) too, like TAL-Dub's IN button. Useful for “telephone” or distant-voice effects. Usually off."

DryWet="Dry / echo mix (DRY / WET) [%]"
DryWet.Help="Balance between your original voice and the echo. 0% = voice only; 50% = voice and echo both at full level; 100% = echo only. 15-35% usually works well for ASMR."
Balance="Left / right balance [%]"
Balance.Help="Shifts the output toward one ear: negative = more left, positive = more right, 0 = centered."
OutputGain="Output volume [dB]"
OutputGain.Help="Final volume after the effect. Lower it if the OBS meter hits red with lots of echo."

