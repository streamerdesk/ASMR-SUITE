Presets.Name="Name for my preset"
Presets.Name.Help="Type a name (e.g. “Night whispers”) and press “Save preset”. If one with that name exists, it is updated."
Presets.Save="Save preset"
Presets.Save.Help="Saves all current settings under the name above. Your presets are stored on your computer and survive OBS restarts."
Presets.Delete="Delete preset"
Presets.Delete.Help="Deletes the selected user preset (built-in ★ presets can't be deleted)."
Presets.Reset="Reset to defaults"
Presets.Reset.Help="Returns every control to its starting value, tuned for USB/condenser microphones."
