PingPongEcho="Streamerdesk ASMR - Eco Ping-Pong"
Description="Streamerdesk ASMR Suite: eco estéreo ping-pong (oreja a oreja) inspirado en TAL-Dub 1. Software libre (GPL-2.0-or-later) - https://streamerdesk.com"

Group.Echo="Eco"
Group.Stereo="Estéreo / Binaural"
Group.Tone="Tono (filtro)"
Group.Mix="Mezcla"

SyncMode="Modo de tiempo"
SyncMode.Manual="Manual (milisegundos)"
SyncMode.Tempo="Tempo musical (BPM + figura)"
SyncMode.Help="Elige cómo fijar el tiempo entre repeticiones. «Manual» te deja escoger los milisegundos exactos. «Tempo musical» calcula el tiempo a partir del BPM de tu música de fondo, para que el eco vaya a ritmo."
DelayLink="Enlazar tiempos izquierda/derecha (LINK)"
DelayLink.Help="Activado: los dos oídos usan el mismo tiempo y el rebote es regular, como un péndulo. Desactívalo para dar a cada lado su propio tiempo y conseguir rebotes irregulares, más amplios y orgánicos."
DelayL="Tiempo del eco (izquierda) [ms]"
DelayL.Help="Cuánto tarda en sonar cada repetición. 150-300 ms suena íntimo y cercano (ideal para susurros); 300-600 ms da el clásico eco que rebota; más de 600 ms crea ambientes amplios y espaciales. Con LINK activado controla los dos lados."
DelayR="Tiempo del eco (derecha) [ms]"
DelayR.Help="Tiempo de las repeticiones del oído derecho cuando LINK está desactivado. Usar un valor algo distinto al izquierdo hace que el sonido «dé vueltas» alrededor de la cabeza."
BPM="Tempo [BPM]"
BPM.Help="Pulsaciones por minuto de tu música o ritmo. El eco se ajustará a ese tempo usando la figura elegida."
DivL="Figura musical (izquierda)"
DivL.Help="Duración del eco en figuras musicales: 1/4 = una negra, 1/8 = una corchea, «.» = con puntillo (más larga), «T» = tresillo. 1/8. (corchea con puntillo) es el clásico eco dub."
DivR="Figura musical (derecha)"
DivR.Help="Figura musical para el lado derecho cuando LINK está desactivado."
FeedbackLink="Enlazar realimentación izquierda/derecha (LINK)"
FeedbackLink.Help="Activado: ambos lados repiten el mismo número de veces. Desactívalo para que un oído tenga una cola de eco más larga que el otro."
FeedbackL="Repeticiones / realimentación (izquierda) [%]"
FeedbackL.Help="Cuántas veces se repite el eco antes de desaparecer. 20-40 % = pocas repeticiones suaves; 50-70 % = cola larga; por encima de 100 % el eco crece sin fin (efecto dub extremo, el limitador lo mantiene bajo control). Con LINK controla ambos lados."
FeedbackR="Repeticiones / realimentación (derecha) [%]"
FeedbackR.Help="Cantidad de repeticiones del lado derecho cuando LINK está desactivado."
Saturate="Limitador cálido en la realimentación"
Saturate.Help="Igual que en TAL-Dub: un limitador suave que redondea y calienta las repeticiones y evita que el eco se descontrole con realimentación alta. Recomendado activado."

PingPong="Cantidad de ping-pong (rebote oreja a oreja) [%]"
PingPong.Help="100 % = cada repetición salta de un oído al otro (izquierda, derecha, izquierda...): el efecto estrella para ASMR con auriculares. 0 % = eco estéreo normal sin rebote. Los valores intermedios dan un rebote más sutil."
StartSide="La primera repetición suena por"
StartSide.Left="Izquierda"
StartSide.Right="Derecha"
StartSide.Help="Oído por el que empieza el rebote. Útil para combinar con tu posición en cámara o con otros efectos."
InputMode="Entrada"
InputMode.Mono="Suma mono (recomendado para micrófonos)"
InputMode.Stereo="Mantener estéreo"
InputMode.Help="«Suma mono» mezcla los dos canales antes del eco: perfecto para micrófonos USB/condensador (Blue Yeti, Rode...) que son mono o mono duplicado; así el rebote queda limpio y centrado. «Mantener estéreo» respeta la imagen de fuentes estéreo (música, micrófonos binaurales)."
SwapLR="Intercambiar izquierda/derecha de la entrada (SWAP L/R)"
SwapLR.Help="Invierte los canales de entrada antes del efecto (como el botón SWAP L/R de TAL-Dub). Solo disponible con entrada estéreo."

Damp="Brillo del eco / corte de agudos (DAMP) [Hz]"
Damp.Help="Filtro paso-bajo resonante de 12 dB/oct. Valores bajos (1500-3500 Hz) oscurecen las repeticiones para un eco cálido, suave y «vintage», ideal para ASMR relajante; valores altos dejan el eco brillante. 20000 Hz = filtro apagado."
Resonance="Resonancia del filtro (RESONANCE) [%]"
Resonance.Help="Realza la zona del corte del filtro: con valores altos las repeticiones adquieren un tono silbante y psicodélico típico del dub. Para ASMR suave déjalo bajo (0-20 %)."
LowCut="Corte de graves (LOW CUT) [Hz]"
LowCut.Help="Quita graves de las repeticiones para que el eco no embarre tu voz ni retumbe con el efecto proximidad del micrófono. 100-150 Hz es un buen punto para micros de condensador. 10 Hz = apagado."
FilterFB="Filtro dentro de la realimentación (FILTER FB)"
FilterFB.Help="Activado (como TAL-Dub): cada repetición pasa otra vez por el filtro, así que el eco se vuelve más oscuro y lejano con cada rebote, muy natural. Desactivado: el filtro se aplica una sola vez al final (modo FX) y todas las repeticiones tienen el mismo tono."
FilterIn="Filtrar también la voz original (IN)"
FilterIn.Help="Aplica el filtro también a la señal seca (tu voz directa), como el botón IN de TAL-Dub. Útil para efectos de «teléfono» o voz lejana. Normalmente desactivado."

DryWet="Mezcla seco / eco (DRY / WET) [%]"
DryWet.Help="Proporción entre tu voz original y el eco. 0 % = solo voz; 50 % = voz y eco a pleno volumen; 100 % = solo eco. Para ASMR suelen ir bien 15-35 %."
Balance="Balance izquierda / derecha [%]"
Balance.Help="Desplaza la salida hacia un oído: valores negativos = más a la izquierda, positivos = más a la derecha, 0 = centrado."
OutputGain="Volumen de salida [dB]"
OutputGain.Help="Ajusta el volumen final después del efecto. Bájalo si el medidor de OBS llega al rojo con mucho eco."

Presets.Group="Presets"
Presets.Select="Preset"
Presets.Select.Help="Elige un preset para cargarlo al instante. ★ = presets incluidos de Streamerdesk; 👤 = tus propios presets. Después puedes retocar cualquier control y guardarlo como tuyo."
Presets.None="— Elige un preset —"
Presets.BuiltinPrefix="★"
Presets.UserPrefix="👤"
Presets.Load="Cargar preset seleccionado"
Presets.Load.Help="Vuelve a cargar el preset elegido, por ejemplo para deshacer tus cambios."
Presets.Name="Nombre para mi preset"
Presets.Name.Help="Escribe un nombre (por ejemplo «Susurros noche») y pulsa «Guardar preset». Si ya existe uno con ese nombre, se actualiza."
Presets.Save="Guardar preset"
Presets.Save.Help="Guarda todos los ajustes actuales con el nombre de arriba. Tus presets se guardan en tu ordenador y se conservan al reiniciar OBS."
Presets.Delete="Borrar preset"
Presets.Delete.Help="Borra el preset de usuario seleccionado (los presets ★ incluidos no se pueden borrar)."
Presets.Reset="Restablecer valores por defecto"
Presets.Reset.Help="Devuelve todos los controles a sus valores iniciales, pensados para micrófonos USB/condensador."
Preset.AsmrSoft="ASMR suave"
Preset.DubClassic="Dub clásico (estilo TAL-Dub)"
Preset.WideBounce="Rebote amplio"
Preset.BinauralWrap="Binaural envolvente"
