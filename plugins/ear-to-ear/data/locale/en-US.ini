EarToEar="Streamerdesk ASMR - Ear to Ear Whisper"
Description="The voice glides smoothly from one ear to the other, made for ASMR on headphones."

Group.Motion="Movement"
Group.Space="Space and closeness"
Group.Output="Output"

Mode="Movement mode"
Mode.Help="Manual: you place the voice with the slider. Automatic: it travels back and forth between your ears. Random: organic, unpredictable wandering. Tempo: synced to your music's BPM."
Mode.Manual="Manual (fixed position)"
Mode.Auto="Automatic (back and forth)"
Mode.Random="Random / organic"
Mode.Tempo="Tempo synced (BPM)"

Position="Position (-100 left · +100 right)"
Position.Help="Where the voice sits in manual mode. -100 is the left ear, 0 the center and +100 the right ear. Changes are smoothed, no clicks."

SpeedUnit="Speed in"
SpeedUnit.Help="Choose whether you set the speed in hertz (full back-and-forth cycles per second) or in seconds per ear-to-ear sweep."
SpeedUnit.Hz="Hertz (cycles per second)"
SpeedUnit.Seconds="Seconds per sweep"
RateHz="Speed"
RateHz.Help="Full cycles (left → right → left) per second. For whispers, 0.05 to 0.3 Hz sounds natural."
SweepSeconds="Sweep duration"
SweepSeconds.Help="Seconds the voice takes to travel from one ear to the other. For whispers, 3 to 8 seconds is very relaxing."
BPM="Tempo"
BPM.Help="Tempo of your music or metronome in beats per minute."
Division="Sweep length"
Division.Help="How long each ear-to-ear move lasts, in note values or bars (4/4)."
Div.Quarter="1 quarter note"
Div.Half="1 half note (2 beats)"
Div.DottedHalf="Dotted half (3 beats)"
Div.Bar1="1 bar"
Div.Bar2="2 bars"
Div.Bar4="4 bars"
Div.Bar8="8 bars"

Depth="Sweep width"
Depth.Help="How far the voice travels. 100% reaches each ear fully; low values move it just a little around the center."
Shape="Movement shape"
Shape.Help="Sine: smooth, continuous movement. Hold at the ears: the voice rests for a moment at each ear before returning, with soft arrivals."
Shape.Sine="Sine (continuous)"
Shape.Hold="Smooth hold at each ear"
Dwell="Hold time at each ear"
Dwell.Help="Part of the cycle the voice stays still next to each ear. 30% is a good starting point."
StartSide="Start at"
StartSide.Help="Which ear the movement starts at when the filter is enabled."
StartSide.Left="Left ear"
StartSide.Right="Right ear"

PanMode="Panning type"
PanMode.Help="Equal-power: classic constant-loudness panning. Binaural: mimics the head (time difference up to 0.7 ms, level difference and high-frequency shadow on the far ear). On headphones, binaural sounds more real."
PanMode.EqualPower="Simple (equal-power)"
PanMode.Binaural="Binaural (headphones)"
Binaural="Binaural intensity"
Binaural.Help="How much head effect is applied: interaural delay, level difference and high-frequency softening on the far ear."
Proximity="Close to the ear"
Proximity.Help="Adds a subtle low-mid warmth when the voice reaches an ear, as if you leaned into the mic. 0% turns it off."
CenterKeep="Keep in the center"
CenterKeep.Help="Part of the voice that always stays in the center, so it never fully disappears from one ear."
CenterDip="Soften the center crossing"
CenterDip.Help="Slightly lowers the level as the voice crosses the center, so arriving at each ear stands out more. 0 dB turns it off."
OutputGain="Output gain"
OutputGain.Help="Final level of the filter. In binaural mode the near ear can be up to +3 dB louder; if your mic runs hot, lower it a little here."

Presets.Group="Presets"
Presets.Select="Preset"
Presets.Select.Help="Pick a preset to load it instantly. ★ = built-in Streamerdesk presets; 👤 = your own presets. Then tweak any control and save it as your own."
Presets.None="— Choose a preset —"
Presets.BuiltinPrefix="★"
Presets.UserPrefix="👤"
Presets.Load="Load selected preset"
Presets.Load.Help="Reloads the selected preset, e.g. to undo your changes."
Presets.Name="Name for my preset"
Presets.Name.Help="Type a name (e.g. “Night whispers”) and press “Save preset”. If one with that name exists, it is updated."
Presets.Save="Save preset"
Presets.Save.Help="Saves all current settings under the name above. Your presets are stored on your computer, survive OBS restarts and are available in all your scenes and sources."
Presets.Delete="Delete preset"
Presets.Delete.Help="Deletes the selected user preset (built-in ★ presets can't be deleted)."
Presets.Reset="Reset to defaults"
Presets.Reset.Help="Returns every control to its starting value, tuned for whispering into USB mics like Blue Yeti or Rode."

Preset.SoftWhisper="Soft whisper (default)"
Preset.SlowEars="Slow ear to ear"
Preset.Tingles="Quick tingles"
Preset.Wander="Organic wander"
Preset.LeftEar="Close to the left ear"
Preset.RightEar="Close to the right ear"
Preset.Tempo="On the beat (70 BPM)"
Preset.WideClose="Wide and very close"
