EarToEar="Streamerdesk ASMR - Susurro de oído a oído"
Description="La voz se desliza suavemente de una oreja a la otra, pensado para ASMR con auriculares."

Group.Motion="Movimiento"
Group.Space="Espacio y cercanía"
Group.Output="Salida"

Mode="Modo de movimiento"
Mode.Help="Manual: tú colocas la voz con el deslizador. Automático: va y viene de oreja a oreja. Aleatorio: paseo orgánico e imprevisible. Tempo: sincronizado con los BPM de tu música."
Mode.Manual="Manual (posición fija)"
Mode.Auto="Automático (ida y vuelta)"
Mode.Random="Aleatorio / orgánico"
Mode.Tempo="Sincronizado al tempo (BPM)"

Position="Posición (-100 izquierda · +100 derecha)"
Position.Help="Dónde suena la voz en modo manual. -100 es la oreja izquierda, 0 el centro y +100 la oreja derecha. Los cambios se suavizan, sin clics."

SpeedUnit="Velocidad en"
SpeedUnit.Help="Elige si prefieres marcar la velocidad en hercios (ciclos de ida y vuelta por segundo) o en segundos por recorrido de una oreja a la otra."
SpeedUnit.Hz="Hercios (ciclos por segundo)"
SpeedUnit.Seconds="Segundos por recorrido"
RateHz="Velocidad"
RateHz.Help="Ciclos completos (izquierda → derecha → izquierda) por segundo. Para susurros, entre 0,05 y 0,3 Hz suena natural."
SweepSeconds="Duración de cada recorrido"
SweepSeconds.Help="Segundos que tarda la voz en pasar de una oreja a la otra. Para susurros, de 3 a 8 segundos es muy relajante."
BPM="Tempo"
BPM.Help="Tempo de tu música o metrónomo en pulsos por minuto."
Division="Duración del recorrido"
Division.Help="Cuánto dura cada paso de una oreja a la otra, en figuras musicales o compases (4/4)."
Div.Quarter="1 negra"
Div.Half="1 blanca (2 tiempos)"
Div.DottedHalf="Blanca con puntillo (3 tiempos)"
Div.Bar1="1 compás"
Div.Bar2="2 compases"
Div.Bar4="4 compases"
Div.Bar8="8 compases"

Depth="Anchura del recorrido"
Depth.Help="Hasta dónde llega la voz. 100 % llega del todo a cada oreja; valores bajos la mueven solo un poco alrededor del centro."
Shape="Forma del movimiento"
Shape.Help="Senoidal: movimiento continuo y redondo. Pausa en las orejas: la voz se queda un momento en cada oreja antes de volver, con llegadas suaves."
Shape.Sine="Senoidal (continuo)"
Shape.Hold="Pausa suave en cada oreja"
Dwell="Tiempo de pausa en cada oreja"
Dwell.Help="Parte del ciclo que la voz se queda quieta junto a cada oreja. 30 % es un buen punto de partida."
StartSide="Empieza por"
StartSide.Help="Oreja por la que empieza el movimiento al activar el filtro."
StartSide.Left="Oreja izquierda"
StartSide.Right="Oreja derecha"

PanMode="Tipo de panorama"
PanMode.Help="Equal-power: panorama clásico de volumen constante. Binaural: imita la cabeza (diferencia de tiempo de hasta 0,7 ms, de volumen y sombra de agudos en la oreja lejana). Para auriculares, binaural suena más real."
PanMode.EqualPower="Simple (equal-power)"
PanMode.Binaural="Binaural (auriculares)"
Binaural="Intensidad binaural"
Binaural.Help="Cuánto efecto de cabeza se aplica: retardo entre orejas, diferencia de volumen y suavizado de agudos en la oreja lejana."
Proximity="Cercanía a la oreja"
Proximity.Help="Añade una calidez sutil en graves y medios cuando la voz llega a una oreja, como si te acercaras al micro. 0 % la desactiva."
CenterKeep="Mantener en el centro"
CenterKeep.Help="Parte de la voz que se queda siempre en el centro. Útil para que no se pierda del todo de un oído."
CenterDip="Suavizar el paso por el centro"
CenterDip.Help="Baja un poco el volumen cuando la voz cruza por el centro, para que se note más la llegada a cada oreja. 0 dB lo desactiva."
OutputGain="Ganancia de salida"
OutputGain.Help="Volumen final del filtro. En binaural la oreja cercana puede sonar hasta +3 dB; si tu micro va muy alto, baja un poco aquí."

Presets.Group="Presets"
Presets.Select="Preset"
Presets.Select.Help="Elige un preset para cargarlo al instante. ★ = presets incluidos de Streamerdesk; 👤 = tus propios presets. Después puedes retocar cualquier control y guardarlo como tuyo."
Presets.None="— Elige un preset —"
Presets.BuiltinPrefix="★"
Presets.UserPrefix="👤"
Presets.Load="Cargar preset seleccionado"
Presets.Load.Help="Vuelve a cargar el preset elegido, por ejemplo para deshacer tus cambios."
Presets.Name="Nombre para mi preset"
Presets.Name.Help="Escribe un nombre (por ejemplo «Susurros noche») y pulsa «Guardar preset». Si ya existe uno con ese nombre, se actualiza."
Presets.Save="Guardar preset"
Presets.Save.Help="Guarda todos los ajustes actuales con el nombre de arriba. Tus presets se guardan en tu ordenador, se conservan al reiniciar OBS y están disponibles en todas tus escenas y fuentes."
Presets.Delete="Borrar preset"
Presets.Delete.Help="Borra el preset de usuario seleccionado (los presets ★ incluidos no se pueden borrar)."
Presets.Reset="Restablecer valores por defecto"
Presets.Reset.Help="Devuelve todos los controles a sus valores iniciales, pensados para susurros con micrófonos USB tipo Blue Yeti o Rode."

Preset.SoftWhisper="Susurro suave (por defecto)"
Preset.SlowEars="Lento de oreja a oreja"
Preset.Tingles="Cosquillas rápidas"
Preset.Wander="Paseo orgánico"
Preset.LeftEar="Pegado a la oreja izquierda"
Preset.RightEar="Pegado a la oreja derecha"
Preset.Tempo="Al ritmo (70 BPM)"
Preset.WideClose="Amplio y muy cercano"
