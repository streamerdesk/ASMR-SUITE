Reverb="Streamerdesk ASMR - Reverb"
Description="Streamerdesk ASMR Suite: reverb estéreo suave y envolvente para susurros y sonidos ASMR. Software libre (GPL-2.0-or-later) - https://streamerdesk.com"

Group.Room="Sala"
Group.Tone="Tono"
Group.Space="Espacio / Estéreo"
Group.Duck="Ducking (la reverb se aparta de tu voz)"
Group.Mix="Mezcla"

Size="Tamaño de la sala [%]"
Size.Help="Cómo de grande se siente el espacio. Valores bajos suenan a una habitación pequeña y cercana, perfecta para susurros íntimos; valores altos abren el sonido como un salón o una iglesia. Los cambios se deslizan suavemente, sin cortes."
Decay="Duración de la cola (decaimiento) [s]"
Decay.Help="Cuánto tarda la reverb en apagarse (RT60). 0,3-0,8 s = habitación; 1-2,5 s = sala acogedora; 3-10 s = espacios enormes y etéreos. Para ASMR relajante suelen ir bien 1-2 s."
PreDelay="Pre-retardo [ms]"
PreDelay.Help="Un pequeño silencio entre tu voz y el inicio de la reverb. 10-40 ms mantiene los susurros claros y nítidos aunque haya mucha reverb; valores altos hacen que el espacio parezca más grande."
Diffusion="Difusión [%]"
Diffusion.Help="Lo densa y suave que es la reverb. Alta = una nube lisa y aterciopelada (ideal para ASMR); baja = se distinguen más los rebotes individuales."
Freeze="Congelar la cola (FREEZE)"
Freeze.Help="Atrapa la reverb que está sonando y la mantiene sonando sin fin, como un colchón de ambiente; mientras está activo no entra sonido nuevo en la reverb. Desactívalo para que se desvanezca con naturalidad."

Damping="Amortiguación de agudos [%]"
Damping.Help="Cuánto absorben las paredes los agudos. Más amortiguación = una cola más cálida, oscura y suave, que no hace sisear las eses de los susurros; menos = un sonido más brillante y aireado."
LowCut="Corte de graves en la reverb [Hz]"
LowCut.Help="Quita graves solo de la reverb (tu voz no se toca). Evita el retumbe y el efecto proximidad de los micros de condensador. 150-250 Hz es un buen punto para Blue Yeti o Rode. 20 Hz = apagado."
HighCut="Corte de agudos en la reverb [Hz]"
HighCut.Help="Suaviza el brillo de la reverb (tu voz no se toca). 6000-9000 Hz da una reverb dulce y relajante; 20000 Hz = apagado."

EarlyLate="Reflexiones tempranas / cola [%]"
EarlyLate.Help="Equilibrio entre los primeros rebotes en las paredes (dan sensación de cercanía y de habitación real) y la cola larga (la nube de reverb). 0 % = solo rebotes tempranos; 50 % = ambos al máximo; 100 % = solo cola, estilo placa."
Width="Anchura estéreo [%]"
Width.Help="Cómo de abierta suena la reverb entre tus dos oídos. 0 % = mono en el centro; 100 % = natural; hasta 150 % = muy envolvente con auriculares."
Modulation="Modulación suave [%]"
Modulation.Help="Un movimiento lento y sutil dentro de la cola (como un chorus muy delicado) que evita el sonido metálico y hace la reverb más viva y orgánica. 20-50 % es lo habitual."
InputMode="Entrada"
InputMode.Mono="Suma mono (recomendado para micrófonos)"
InputMode.Stereo="Mantener estéreo"
InputMode.Help="«Suma mono» mezcla los dos canales antes de la reverb: perfecto para micrófonos USB/condensador (Blue Yeti, Rode…) que son mono o mono duplicado. «Mantener estéreo» respeta la imagen de fuentes estéreo como micros binaurales o música."

Duck="Ducking (bajar la reverb mientras hablas) [%]"
Duck.Help="Baja la reverb mientras suena tu voz y la deja florecer en las pausas: tus susurros se entienden perfectamente y el ambiente aparece entre frase y frase. 0 % = apagado; 30-60 % es muy natural."
DuckRelease="Recuperación del ducking [ms]"
DuckRelease.Help="Cuánto tarda la reverb en volver a su nivel cuando dejas de hablar. Valores cortos = vuelve rápido; largos = aparece despacio y con suavidad."

DryWet="Mezcla seco / reverb (DRY / WET) [%]"
DryWet.Help="Proporción entre tu voz original y la reverb. 0 % = solo voz; 50 % = voz y reverb ambas a pleno volumen; 100 % = solo reverb. Para susurros suelen ir bien 15-35 %."
OutputGain="Volumen de salida [dB]"
OutputGain.Help="Ajusta el volumen final después del efecto. Bájalo si el medidor de OBS llega al rojo."

Presets.Group="Presets"
Presets.Select="Preset"
Presets.Select.Help="Elige un preset para cargarlo al instante. ★ = presets incluidos de Streamerdesk; 👤 = tus propios presets. Después puedes retocar cualquier control y guardarlo como tuyo."
Presets.None="— Elige un preset —"
Presets.BuiltinPrefix="★"
Presets.UserPrefix="👤"
Presets.Load="Cargar preset seleccionado"
Presets.Load.Help="Vuelve a cargar el preset elegido, por ejemplo para deshacer tus cambios."
Presets.Name="Nombre para mi preset"
Presets.Name.Help="Escribe un nombre (por ejemplo «Lluvia nocturna») y pulsa «Guardar preset». Si ya existe uno con ese nombre, se actualiza."
Presets.Save="Guardar preset"
Presets.Save.Help="Guarda todos los ajustes actuales con el nombre de arriba. Tus presets se guardan solo en tu ordenador y se conservan al reiniciar OBS."
Presets.Delete="Borrar preset"
Presets.Delete.Help="Borra el preset de usuario seleccionado (los presets ★ incluidos no se pueden borrar)."
Presets.Reset="Restablecer valores por defecto"
Presets.Reset.Help="Devuelve todos los controles a sus valores iniciales, pensados para susurros con micrófonos USB/condensador."
Preset.IntimateRoom="Habitación íntima"
Preset.SoftHall="Sala suave"
Preset.WhisperCathedral="Catedral susurro"
Preset.WarmPlate="Placa cálida"
