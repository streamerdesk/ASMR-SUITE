Presets.Save="Save preset"
Presets.Save.Help="Saves all current settings under the name above. Your presets are stored only on your computer and survive OBS restarts."
Presets.Delete="Delete preset"
Presets.Delete.Help="Deletes the selected user preset (built-in ★ presets can't be deleted)."
Presets.Reset="Reset to defaults"
Presets.Reset.Help="Returns every control to its starting value, tuned for whispering into USB/condenser microphones."
