Reverb="Streamerdesk ASMR - Reverb"
Description="Streamerdesk ASMR Suite: soft, enveloping stereo reverb for whispers and ASMR sounds. Free software (GPL-2.0-or-later) - https://streamerdesk.com"

Group.Room="Room"
Group.Tone="Tone"
Group.Space="Space / Stereo"
Group.Duck="Ducking (reverb steps aside for your voice)"
Group.Mix="Mix"

Size="Room size [%]"
Size.Help="How big the space feels. Low values sound like a small, close room, perfect for intimate whispers; high values open the sound up like a hall or a church. Changes glide smoothly with no clicks."
Decay="Tail length (decay) [s]"
Decay.Help="How long the reverb takes to fade (RT60). 0.3-0.8 s = room; 1-2.5 s = cozy hall; 3-10 s = huge, ethereal spaces. 1-2 s usually works well for relaxing ASMR."
PreDelay="Pre-delay [ms]"
PreDelay.Help="A tiny gap between your voice and the start of the reverb. 10-40 ms keeps whispers clear and crisp even with lots of reverb; higher values make the space feel bigger."
Diffusion="Diffusion [%]"
Diffusion.Help="How dense and smooth the reverb is. High = a smooth, velvety cloud (ideal for ASMR); low = you hear more individual reflections."
Freeze="Freeze the tail (FREEZE)"
Freeze.Help="Captures the reverb that is playing and sustains it endlessly, like an ambient pad; while on, no new sound enters the reverb. Turn it off to let it fade naturally."

Damping="High-frequency damping [%]"
Damping.Help="How much the walls absorb treble. More damping = a warmer, darker, softer tail that doesn't make whispered S sounds hiss; less = a brighter, airier sound."
LowCut="Reverb low cut [Hz]"
LowCut.Help="Removes bass from the reverb only (your voice is untouched). Avoids boominess and the proximity effect of condenser mics. 150-250 Hz is a good spot for a Blue Yeti or Rode. 20 Hz = off."
HighCut="Reverb high cut [Hz]"
HighCut.Help="Softens the brightness of the reverb (your voice is untouched). 6000-9000 Hz gives a sweet, relaxing reverb; 20000 Hz = off."

EarlyLate="Early reflections / tail [%]"
EarlyLate.Help="Balance between the first wall reflections (they give a sense of closeness and a real room) and the long tail (the reverb cloud). 0% = early reflections only; 50% = both at full level; 100% = tail only, plate style."
Width="Stereo width [%]"
Width.Help="How wide the reverb sounds between your ears. 0% = mono in the center; 100% = natural; up to 150% = very enveloping on headphones."
Modulation="Gentle modulation [%]"
Modulation.Help="A slow, subtle movement inside the tail (like a very delicate chorus) that prevents metallic ringing and makes the reverb livelier and more organic. 20-50% is typical."
InputMode="Input"
InputMode.Mono="Mono sum (recommended for microphones)"
InputMode.Stereo="Keep stereo"
InputMode.Help="“Mono sum” mixes both channels before the reverb: perfect for USB/condenser mics (Blue Yeti, Rode…) that are mono or dual-mono. “Keep stereo” preserves the image of stereo sources such as binaural mics or music."

Duck="Ducking (lower the reverb while you talk) [%]"
Duck.Help="Lowers the reverb while your voice is playing and lets it bloom in the pauses: your whispers stay perfectly clear and the ambience appears between phrases. 0% = off; 30-60% sounds very natural."
DuckRelease="Ducking release [ms]"
DuckRelease.Help="How long the reverb takes to come back after you stop talking. Short = comes back fast; long = fades in slowly and gently."

DryWet="Dry / reverb mix (DRY / WET) [%]"
DryWet.Help="Balance between your original voice and the reverb. 0% = voice only; 50% = voice and reverb both at full level; 100% = reverb only. 15-35% usually works well for whispers."
OutputGain="Output volume [dB]"
OutputGain.Help="Final volume after the effect. Lower it if the OBS meter hits red."

